[project]
name = "spatial-memory"
version = "0.1.0"
description = "A spatial memory system for finding things - powered by Google ADK and LlamaIndex"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-adk>=0.3.0",
    "llama-index>=0.12.0",
    "llama-index-graph-stores-neo4j>=0.5.0",
    "llama-index-embeddings-google-genai>=0.3.0",
    "neo4j>=5.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spatial_memory_agent", "services", "models", "api", "config.py"]
